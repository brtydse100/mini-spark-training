[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workframe-training"
version = "0.2.0"
description = "Local execution skeleton for a code-reading and refactoring exercise"
requires-python = ">=3.11"
dependencies = ["pywin32>=306; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["build>=1", "pytest>=8", "openpyxl>=3.1"]

[project.scripts]
workframe-run = "workframe.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["checks"]
