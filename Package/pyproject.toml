[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "workframe"
version = "0.3.0"
description = "Local Python task execution with JSON messaging and Windows resource controls"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pywin32>=306; sys_platform == 'win32'"]

[project.optional-dependencies]
dev = ["build>=1", "pytest>=8"]

[project.scripts]
workframe-run = "workframe.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
